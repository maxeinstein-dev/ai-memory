[package]
name = "ai-memory-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP browser for the ai-memory wiki (project list, tree navigation, markdown rendering, FTS5 search). Read-only except for the fork's POST /handoff route."

[dependencies]
ai-memory-core.workspace = true
ai-memory-store.workspace = true
ai-memory-wiki.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum.workspace = true
jiff.workspace = true
sha2.workspace = true
# CSRF key generation (`POST /handoff`) and constant-time token comparison.
# Both already workspace dependencies used by ai-memory-mcp/ai-memory-store
# for the same purposes (auth tokens, user salts) — not new to the
# workspace, just newly declared for this crate.
getrandom.workspace = true
subtle.workspace = true
tower.workspace = true
tower-http.workspace = true

# Templating + markdown.
askama = "0.12"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[build-dependencies]
anyhow.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
