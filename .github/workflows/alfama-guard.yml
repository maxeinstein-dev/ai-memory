name: alfama-guard

# Fork-only invariants that a rebase onto upstream could silently undo.
# Kept in a file upstream does not have, so no rebase conflict removes it.

on:
  push:
    branches: [alfama/main]
  pull_request:

permissions:
  contents: read

jobs:
  fork-ci:
    name: ci.yml runs on push to alfama/main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/alfama/check-fork-ci.sh
